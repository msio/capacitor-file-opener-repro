<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
    <title>FileOpener repro</title>
    <style>
      body { font: 16px -apple-system, sans-serif; margin: 0; padding: 60px 16px 16px; }

    <script type="module" src="./main.js"></script>
